appId: dev.elyspio.gtnh-server-updater
productName: GTNH Server Updater
directories:
    output: dist
    # icon.png (1024 px) and icon.ico, generated from src/renderer/public/icon.svg by `pnpm icons`.
    buildResources: build
files:
    - out/**
win:
    target: nsis
    icon: build/icon.ico
    executableName: GTNH Server Updater
nsis:
    artifactName: ${name}-${version}-setup.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    oneClick: false
    allowToChangeInstallationDirectory: true
linux:
    target:
        - AppImage
        - deb
    category: Utility
    icon: build/icon.png
    maintainer: jona.guich69@gmail.com
appImage:
    artifactName: ${name}-${version}.${ext}
deb:
    artifactName: ${name}_${version}_${arch}.${ext}
publish:
    provider: github
    owner: Elyspio
    repo: gtnh-server-updater
    releaseType: release
electronFuses:
    runAsNode: false
    enableCookieEncryption: true
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    enableEmbeddedAsarIntegrityValidation: true
    onlyLoadAppFromAsar: true
